; Plain pio run builds the BTS7960 configuration, matching the existing VS Code tasks.
[platformio]
default_envs = esp32dev

; Shared classic ESP32 board/toolchain settings; pin the platform for repeatable builds.
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; MQTT client library; compatible 2.x updates require an explicit dependency refresh.
lib_deps =
    knolleary/PubSubClient@^2.8

; Alternative RC PWM build, inheriting the board and dependencies above.
; Change this one model selection for all four motors; all controllers must match.
[env:esp32dev-frc-pwm]
extends = env:esp32dev
build_flags =
    -DMOTOR_CONTROLLER=MOTOR_CONTROLLER_VICTOR_SPX